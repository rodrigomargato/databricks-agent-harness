resources:
  jobs:
    us01_bronze_contracts:
      name: us01-bronze-contracts-dev
      environments:
        - environment_key: us01
          spec:
            environment_version: "2"
            dependencies:
              - openpyxl
      tasks:
        - task_key: ingest_bronze_contracts
          environment_key: us01
          notebook_task:
            notebook_path: ../notebooks/us01_bronze_contracts.py
            base_parameters:
              catalog_url: "${var.catalog_url}"
              contracts_year: "${var.contracts_year}"
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              landing_volume: "${var.landing_volume}"
